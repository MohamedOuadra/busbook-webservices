env:
  contexts:
  - excludePaths: []
    name: baseline
    urls:
    - http://busbook-ticket-service:8084
  parameters:
    failOnError: true
    progressToStdout: false
jobs:
- parameters:
    enableTags: false
    maxAlertsPerRule: 10
  type: passiveScan-config
- parameters:
    maxDuration: 1
    url: http://busbook-ticket-service:8084
  type: spider
- parameters:
    maxDuration: 5
  type: passiveScan-wait
- parameters:
    format: Long
    summaryFile: /home/zap/zap_out.json
  rules: []
  type: outputSummary
- parameters:
    reportDescription: ''
    reportDir: /zap/wrk/
    reportFile: ticket-service-zap-report.html
    reportTitle: ZAP Scanning Report
    template: traditional-html
  type: report
- parameters:
    reportDescription: ''
    reportDir: /zap/wrk/
    reportFile: ticket-service-zap-report.json
    reportTitle: ZAP Scanning Report
    template: traditional-json
  type: report

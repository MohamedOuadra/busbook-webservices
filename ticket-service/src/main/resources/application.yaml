server:
  port: 8084

spring:
  application:
    name: ticket-service
  datasource:
    url: jdbc:postgresql://localhost:5433/busbook
    username: postgres
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

services:
  reservation-service:
    url: ${RESERVATION_SERVICE_URL:http://localhost:8082}

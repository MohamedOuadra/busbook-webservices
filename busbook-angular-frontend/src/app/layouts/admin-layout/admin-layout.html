<div class="admin-shell">
  <!-- Navbar principale BusBook unifiée -->
  <app-navbar />

  <!-- Espace Admin Header & Onglets -->
  <div class="admin-subbar glass">
    <div class="admin-title-badge">
      <div class="admin-dot-pulse"></div>
      <div class="admin-heading">
        <span class="subbar-tag">CONSOLE D'ADMINISTRATION</span>
        <span class="subbar-title">Gestion BusBook</span>
      </div>
    </div>

    <!-- Onglets d'administration -->
    <nav class="admin-tabs">
      @for (tab of tabs; track tab.route) {
        <a
          [routerLink]="tab.route"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: tab.exact }"
          class="admin-tab-btn"
        >
          @if (tab.icon === 'dashboard') {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="tab-svg">
              <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/>
              <rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
            </svg>
          }
          @if (tab.icon === 'trips') {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="tab-svg">
              <path d="M3 17l4-8 4 4 4-6 4 10"/><line x1="3" y1="17" x2="21" y2="17"/>
            </svg>
          }
          @if (tab.icon === 'bus') {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="tab-svg">
              <rect x="2" y="6" width="20" height="12" rx="2.5"/>
              <path d="M6 18v2M18 18v2M2 11h20"/>
              <circle cx="6" cy="15" r="1.2" fill="currentColor"/>
              <circle cx="18" cy="15" r="1.2" fill="currentColor"/>
            </svg>
          }
          @if (tab.icon === 'reservations') {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="tab-svg">
              <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/>
              <rect x="9" y="3" width="6" height="4" rx="1"/>
              <line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="13" y2="16"/>
            </svg>
          }
          <span>{{ tab.label }}</span>
        </a>
      }
    </nav>
  </div>

  <!-- Contenu de la page admin -->
  <main class="admin-page-container">
    <router-outlet />
  </main>
</div>

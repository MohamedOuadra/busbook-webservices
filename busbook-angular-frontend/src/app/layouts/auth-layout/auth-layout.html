<div class="auth-layout">
  <!-- Minimalist Brand Header -->
  <header class="auth-topbar">
    <a routerLink="/" class="auth-brand" aria-label="BusBook Home">
      <div class="brand-badge">
        <svg viewBox="0 0 32 32" fill="none" class="brand-svg">
          <rect width="32" height="32" rx="9" fill="#B7D8A5"/>
          <g transform="rotate(-24 16 16.5)">
            <!-- Flap arrière du ticket -->
            <path d="M 9.5 11.2 L 14.5 5.8 C 15.1 5.2 16.1 5.2 16.7 5.8 L 19.2 11.2 Z" fill="#1D1D1B"/>
            <!-- Corps principal du ticket -->
            <path d="M 8.5 11.2 L 23.5 11.2 C 24.6 11.2 25.5 12.1 25.5 13.2 L 25.5 14.2 A 2.3 2.3 0 0 0 25.5 18.8 L 25.5 19.8 C 25.5 20.9 24.6 21.8 23.5 21.8 L 8.5 21.8 C 7.4 21.8 6.5 20.9 6.5 19.8 L 6.5 18.8 A 2.3 2.3 0 0 0 6.5 14.2 L 6.5 13.2 C 6.5 12.1 7.4 11.2 8.5 11.2 Z" 
                  fill="#B7D8A5" stroke="#1D1D1B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            <!-- Points de perforation -->
            <circle cx="21" cy="14" r="1.1" fill="#1D1D1B"/>
            <circle cx="21" cy="16.5" r="1.1" fill="#1D1D1B"/>
            <circle cx="21" cy="19" r="1.1" fill="#1D1D1B"/>
          </g>
        </svg>
      </div>
      <span class="brand-text">Bus<span class="brand-highlight">Book</span></span>
    </a>

    <a routerLink="/" class="back-home-btn glass">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="arrow-icon">
        <line x1="19" y1="12" x2="5" y2="12"/>
        <polyline points="12 19 5 12 12 5"/>
      </svg>
      <span>Back to Home</span>
    </a>
  </header>

  <!-- Focused Center Area -->
  <main class="auth-main">
    <router-outlet />
  </main>

  <!-- Footer -->
  <footer class="auth-footer">
    <p>© 2026 BusBook. Fast, reliable intercity bus travel in Morocco.</p>
  </footer>
</div>

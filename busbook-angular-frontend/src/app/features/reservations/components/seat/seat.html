<button
  type="button"
  class="seat-btn"
  [class.available]="status === 'available'"
  [class.occupied]="status === 'occupied'"
  [class.selected]="status === 'selected'"
  [disabled]="status === 'occupied'"
  [attr.aria-label]="'Seat ' + number + ' - ' + status"
  [attr.aria-pressed]="status === 'selected'"
  (click)="selectSeat()"
  [title]="'Seat #' + number + ' (' + status + ')'"
>
  <svg class="seat-chair-svg" viewBox="0 0 24 24" fill="currentColor">
    <path d="M7 3C5.34 3 4 4.34 4 6v9c0 1.1.9 2 2 2v2c0 .55.45 1 1 1s1-.45 1-1v-2h8v2c0 .55.45 1 1 1s1-.45 1-1v-2c1.1 0 2-.9 2-2V6c0-1.66-1.34-3-3-3H7zm0 2h10c.55 0 1 .45 1 1v5H6V6c0-.55.45-1 1-1zm-1 8h12v2H6v-2z"/>
  </svg>
</button>

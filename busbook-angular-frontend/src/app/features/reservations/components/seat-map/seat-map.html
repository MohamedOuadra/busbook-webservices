<div class="seat-map-inner">
  <!-- Steering Wheel at front-right of the bus interior -->
  <div class="bus-interior-header">
    <div class="steering-wheel-pill">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="wheel-icon">
        <circle cx="12" cy="12" r="9"/>
        <circle cx="12" cy="12" r="2.5"/>
        <path d="M12 14.5V21M3.5 9.5l6.5 2M20.5 9.5l-6.5 2"/>
      </svg>
    </div>
  </div>

  <!-- Rows Grid -->
  <div class="coach-seats-grid">
    @for (row of seatRows; track $index) {
      <div class="coach-seat-row">
        <!-- Left pair -->
        <div class="seat-pair left">
          @if (row.seat1) {
            <app-seat
              [number]="row.seat1.number"
              [status]="getSeatStatus(row.seat1)"
              (seatSelected)="selectSeat($event)"
            />
          }
          @if (row.seat2) {
            <app-seat
              [number]="row.seat2.number"
              [status]="getSeatStatus(row.seat2)"
              (seatSelected)="selectSeat($event)"
            />
          }
        </div>

        <!-- Middle Aisle -->
        <div class="seat-aisle">
          <span class="aisle-dot"></span>
        </div>

        <!-- Right pair -->
        <div class="seat-pair right">
          @if (row.seat3) {
            <app-seat
              [number]="row.seat3.number"
              [status]="getSeatStatus(row.seat3)"
              (seatSelected)="selectSeat($event)"
            />
          }
          @if (row.seat4) {
            <app-seat
              [number]="row.seat4.number"
              [status]="getSeatStatus(row.seat4)"
              (seatSelected)="selectSeat($event)"
            />
          }
        </div>
      </div>
    }
  </div>
</div>

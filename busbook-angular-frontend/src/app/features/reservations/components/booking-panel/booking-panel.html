<div class="booking-split-grid">
  <!-- Column 1: Coach Seat Map (projected) + Contact input -->
  <div class="col-seat-selection">
    <ng-content></ng-content>

    <div class="contact-under-seat">
      <div class="passenger-field">
        <input
          id="phoneNumber"
          type="tel"
          name="phoneNumber"
          [(ngModel)]="phoneNumber"
          placeholder="+212 612-345678"
          [disabled]="!isLoggedIn"
          class="clean-input"
        />
        <label for="phoneNumber" class="field-sublabel">Passenger's Contact Number</label>
      </div>

      <!-- Hidden / compact email & name required for booking API -->
      @if (isLoggedIn) {
        <input type="hidden" name="fullName" [(ngModel)]="fullName" required />
        <input type="hidden" name="email" [(ngModel)]="email" required />
      } @else {
        <div class="name-email-mini">
          <input
            type="text"
            name="fullName"
            [(ngModel)]="fullName"
            placeholder="Your full name"
            required
            class="clean-mini-input"
          />
          <input
            type="email"
            name="email"
            [(ngModel)]="email"
            placeholder="your.email@busbook.ma"
            required
            email
            class="clean-mini-input"
          />
        </div>
      }
    </div>
  </div>

  <!-- Column 2: Vertical Summary list + Buy Now button -->
  <div class="col-fare-summary">
    @if (!isLoggedIn) {
      <div class="auth-notice-pill glass">
        <span class="auth-lock">🔒</span>
        <div class="auth-text">
          <strong>Sign in required</strong>
          <small>Login to hold your seat</small>
        </div>
        <a
          routerLink="/login"
          [queryParams]="{ returnUrl: '/reservation/' + trip.id }"
          class="auth-link-btn"
        >
          Sign In
        </a>
      </div>
    }

    <!-- Vertical summary list -->
    <app-booking-summary
      [from]="trip.villeDepart"
      [to]="trip.villeArrivee"
      [date]="trip.dateDepart"
      [seatNumber]="seatNumber"
      [price]="trip.prix"
    />

    <!-- Action button with circular arrow matching reference -->
    <button
      type="button"
      class="btn-buy-now"
      [class.btn-auth-mode]="!isLoggedIn"
      [disabled]="seatNumber === null || isSubmitting"
      (click)="onContinueBooking()"
    >
      <span class="btn-arrow-circle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </span>
      <span class="btn-caption">
        @if (isSubmitting) {
          Holding...
        } @else if (!isLoggedIn) {
          Sign In to Book
        } @else {
          Buy Now
        }
      </span>
    </button>
  </div>
</div>

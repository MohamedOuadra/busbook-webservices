<div class="home-page">
    <section class="home-main">

        <app-trip-search (search)="onTripSearch($event)" />

        <section class="trip-results">
            <div class="results-header">
                <div>
                    <span class="section-label">AVAILABLE TRIPS</span>
                    <h2>Choose your journey</h2>
                </div>

                <span class="results-count">
                    {{ trips.length }} trips found
                </span>
            </div>

            @if (trips.length > 0) {
            <div class="trip-results-list">
                @for (trip of trips; track trip.id) {
                <app-trip-card [trip]="trip" (tripSelected)="onTripSelected($event)" />
                }
            </div>
            } @else {
            <div class="empty-results glass">
                <h3>No trips found</h3>
                <p>Try changing your departure, destination or travel date.</p>
            </div>
            }
        </section>

    </section>

</div>

<section class="journey-card glass">

  <!-- Header -->
  <div class="journey-header">
    <div>
      <span class="journey-label">YOUR JOURNEY</span>
      <h2>Choose your destination</h2>
    </div>

    <button class="journey-more" aria-label="More options">
      <svg viewBox="0 0 24 24">
        <circle cx="5" cy="12" r="1" />
        <circle cx="12" cy="12" r="1" />
        <circle cx="19" cy="12" r="1" />
      </svg>
    </button>
  </div>

  <!-- Route -->
  <div class="journey-route">

    <div class="route-point">
      <span class="route-label">FROM</span>
      <strong>Dhaka</strong>
      <span class="route-detail">Bangladesh</span>
    </div>

    <div class="route-middle">
      <span class="route-line"></span>

      <span class="route-icon">
        <svg viewBox="0 0 24 24">
          <path d="M3 12h18M13 5l7 7-7 7" />
        </svg>
      </span>

      <span class="route-line"></span>
    </div>

    <div class="route-point">
      <span class="route-label">TO</span>
      <strong>Rangpur</strong>
      <span class="route-detail">Bangladesh</span>
    </div>

  </div>

  <!-- Travel information -->
  <div class="journey-footer">

    <div class="journey-info">
      <span class="info-label">DATE</span>
      <strong>12 June 2026</strong>
    </div>

    <div class="journey-info">
      <span class="info-label">PASSENGERS</span>
      <strong>1 Passenger</strong>
    </div>

    <div class="journey-info">
      <span class="info-label">TRIP TYPE</span>
      <strong>One Way</strong>
    </div>

  </div>

</section>

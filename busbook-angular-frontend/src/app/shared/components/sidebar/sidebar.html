<aside class="sidebar">

  <div class="sidebar-top">

    <!-- Back to Home button -->
    <a routerLink="/" class="sidebar-button glass" aria-label="Home" title="Home">
      <svg viewBox="0 0 24 24">
        <path d="M19 12H5M12 19l-7-7 7-7" />
      </svg>
    </a>

    <!-- Navigation icons -->
    <div class="sidebar-menu">

      <!-- Home / Search -->
      <a
        routerLink="/"
        [routerLinkActiveOptions]="{ exact: true }"
        routerLinkActive="active"
        class="sidebar-button glass"
        aria-label="Search Trips"
        title="Search Trips"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/>
          <path d="m21 21-4.3-4.3"/>
        </svg>
      </a>

      <!-- My Bookings -->
      <a
        routerLink="/my-reservations"
        routerLinkActive="active"
        class="sidebar-button glass"
        aria-label="My Bookings"
        title="My Bookings"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 11l3 3L22 4" />
          <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" />
        </svg>
      </a>

      <!-- Verify Ticket -->
      <a
        routerLink="/verify-ticket"
        routerLinkActive="active"
        class="sidebar-button glass"
        aria-label="Verify Ticket"
        title="Verify Ticket"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" />
          <path d="M7 7h3v3H7zM14 7h3v3h-3zM7 14h3v3H7zM14 14h.01M17 14h.01M14 17h3" />
        </svg>
      </a>

    </div>
  </div>

  <!-- Bottom actions -->
  <div class="sidebar-bottom">

    <a routerLink="/my-reservations" class="sidebar-button glass" aria-label="Customer Profile" title="Customer Profile">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="7" r="4"/>
        <path d="M5.5 21a8.5 8.5 0 0 1 13 0"/>
      </svg>
    </a>

    <span class="sidebar-avatar" title="Active Traveler"></span>

  </div>

</aside>

<header class="top-nav">

  <!-- Logo -->
  <a routerLink="/" class="brand" aria-label="BusBook Home">
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
      class="brand-icon"
    >
      <path d="M2 9V6a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v3"/>
      <path d="M2 9h20v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2z"/>
      <path d="M6 13h.01M10 13h.01M14 13h.01M18 13h.01"/>
      <path d="M7 20v2M17 20v2"/>
    </svg>
    <span class="brand-text">BusBook</span>
  </a>

  <!-- Navigation -->
  <nav class="nav-tabs">
    @for (item of navItems; track item.route) {
      <a
        [routerLink]="item.route"
        [routerLinkActiveOptions]="{ exact: item.exact }"
        routerLinkActive="active"
        class="nav-link"
      >
        {{ item.label }}
      </a>
    }
  </nav>

  <!-- Location and settings -->
  <div class="nav-actions">
    <div class="location-badge glass">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        class="location-icon"
      >
        <path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/>
        <circle cx="12" cy="10" r="2.5"/>
      </svg>
      <span>Region:</span>
      <strong>Maroc</strong>
    </div>

    <button class="settings-button glass" routerLink="/my-reservations" aria-label="My Bookings">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M9 11l3 3L22 4" />
        <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" />
      </svg>
    </button>
  </div>
</header>

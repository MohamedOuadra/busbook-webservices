<header class="top-nav">

  <!-- Logo -->
  <a routerLink="/" class="brand" aria-label="BusBook Home">
    <div class="brand-badge">
      <svg viewBox="0 0 28 28" fill="none" class="brand-svg">
        <rect width="28" height="28" rx="8" fill="#20201E"/>
        <!-- Ticket voucher shape with side notches -->
        <path d="M6 9C6 7.89 6.89 7 8 7H20C21.11 7 22 7.89 22 9V12.5C21.17 12.5 20.5 13.17 20.5 14C20.5 14.83 21.17 15.5 22 15.5V19C22 20.11 21.11 21 20 21H8C6.89 21 6 20.11 6 19V15.5C6.83 15.5 7.5 14.83 7.5 14C7.5 13.17 6.83 12.5 6 12.5V9Z" fill="#FDFBF7"/>
        <!-- Sleek bus cabin silhouette -->
        <path d="M10 10.5H18V13.5H10V10.5Z" fill="#20201E"/>
        <circle cx="11" cy="17" r="1.1" fill="#F99271"/>
        <circle cx="17" cy="17" r="1.1" fill="#F99271"/>
        <rect x="13" y="16.5" width="2" height="1" rx="0.5" fill="#20201E"/>
      </svg>
    </div>
    <span class="brand-text">Bus<span class="brand-highlight">Book</span></span>
  </a>

  <!-- Navigation Pills -->
  <nav class="nav-tabs">
    @for (item of navItems; track item.route) {
      <a
        [routerLink]="item.route"
        [routerLinkActiveOptions]="{ exact: item.exact }"
        routerLinkActive="active"
        class="nav-link"
      >
        {{ item.label }}
      </a>
    }
  </nav>

  <!-- Location and actions -->
  <div class="nav-actions">
    <div class="location-badge glass">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        class="location-icon"
      >
        <path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/>
        <circle cx="12" cy="10" r="2.5"/>
      </svg>
      <span>Region:</span>
      <strong>Maroc</strong>
    </div>

    @if (isAdmin()) {
      <a routerLink="/admin" class="admin-link glass" title="Administration">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="admin-icon">
          <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
        </svg>
        <span>Admin</span>
      </a>
    }

    @if (currentUser(); as user) {
      <div class="user-pill glass">
        <span class="user-avatar-mini">{{ user.fullName.charAt(0).toUpperCase() }}</span>
        <span class="user-name"><strong>{{ user.fullName.split(' ')[0] }}</strong></span>
        <button class="logout-btn" (click)="logout()" title="Sign Out" aria-label="Sign Out">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="logout-icon">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>
    } @else {
      <a routerLink="/login" class="login-link glass">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="login-icon">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span>Sign In</span>
      </a>
    }

    <!-- Settings Gear Icon pointing to /settings -->
    <a class="settings-button glass" routerLink="/settings" routerLinkActive="active" aria-label="Settings & Profile" title="Settings & Profile">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </a>
  </div>
</header>

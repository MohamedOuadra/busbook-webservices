spring:
  application:
    name: reservation-service
    jpa:
      open-in-view: false

  datasource:
    url: jdbc:postgresql://localhost:5432/busbook
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8082
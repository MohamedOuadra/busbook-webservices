spring:
  application:
    name: reservation-service
  jackson:
    serialization:

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
              format_sql: true

  datasource:
    url: jdbc:postgresql://localhost:5433/busbook
    username: postgres
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver



server:
  port: 8082